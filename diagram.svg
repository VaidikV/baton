<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c887e"/>
    </marker>
  </defs>
  <rect width="1200" height="1210" fill="#f8f7f3"/>

  <text x="72" y="118" font-size="58" font-weight="800" fill="#1c1b18">When should I start a fresh session?</text>
  <text x="72" y="172" font-size="28" fill="#6b6860">baton · a Claude Code hook that asks Jev or your own model</text>

  <g stroke="#8c887e" stroke-width="3" fill="none">
    <!-- main column -->
    <line x1="386" y1="330" x2="386" y2="386" marker-end="url(#head)"/>
    <line x1="386" y1="540" x2="386" y2="596" marker-end="url(#head)"/>
    <line x1="386" y1="770" x2="386" y2="826" marker-end="url(#head)"/>
    <line x1="386" y1="980" x2="386" y2="1036" marker-end="url(#head)"/>
    <!-- side branches -->
    <line x1="700" y1="465" x2="776" y2="465" stroke-dasharray="9 7" marker-end="url(#head)"/>
    <line x1="700" y1="685" x2="776" y2="685" stroke-dasharray="9 7" marker-end="url(#head)"/>
    <line x1="700" y1="905" x2="776" y2="905" stroke-dasharray="9 7" marker-end="url(#head)"/>
    <!-- local rule: yes -> nudge -->
    <polyline points="1090,800 1090,1090 704,1090" marker-end="url(#head)"/>
  </g>
  <g font-size="24" font-weight="700" fill="#8c887e">
    <text x="402" y="578">yes</text>
    <text x="402" y="1018">yes</text>
    <text x="722" y="452">no</text>
    <text x="722" y="892">no</text>
    <text x="1104" y="1000">yes</text>
  </g>

  <!-- 1 -->
  <rect x="72" y="230" width="628" height="100" rx="18" fill="#fff" stroke="#d6d1c8" stroke-width="2.5"/>
  <text x="108" y="293" font-size="34" font-weight="800" fill="#1c1b18">Claude finishes a reply</text>

  <!-- 2 -->
  <rect x="72" y="390" width="628" height="150" rx="18" fill="#fff" stroke="#d6d1c8" stroke-width="2.5"/>
  <text x="108" y="444" font-size="34" font-weight="800" fill="#1c1b18">Quick checks on my machine</text>
  <text x="108" y="484" font-size="26" fill="#6b6860">Over 150K? No nudge in the last 15 min?</text>
  <text x="108" y="518" font-size="26" fill="#6b6860">A reply it hasn't judged yet?</text>
  <rect x="780" y="430" width="270" height="70" rx="35" fill="none" stroke="#d6d1c8" stroke-width="2.5"/>
  <text x="915" y="475" font-size="28" fill="#6b6860" text-anchor="middle">Stay quiet</text>

  <!-- 3 -->
  <rect x="72" y="600" width="628" height="170" rx="18" fill="#eef0fb" stroke="#93a3dd" stroke-width="2.5"/>
  <text x="108" y="654" font-size="34" font-weight="800" fill="#1c1b18">Ask two questions</text>
  <text x="108" y="696" font-size="26" fill="#4a5580">Is the work finished? Was it hands-on?</text>
  <text x="108" y="740" font-size="26" fill="#4a5580">Sends counts and yes/no flags only. No text.</text>
  <rect x="780" y="575" width="348" height="225" rx="18" fill="#fbf9f4" stroke="#c9c3b8" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="808" y="624" font-size="28" font-weight="800" fill="#1c1b18">No backend answer?</text>
  <text x="808" y="664" font-size="24" fill="#6b6860">Local rule: nudge when over</text>
  <text x="808" y="696" font-size="24" fill="#6b6860">budget and not mid-task.</text>
  <text x="808" y="728" font-size="24" fill="#6b6860">Past 125%, always.</text>
  <text x="808" y="772" font-size="22" fill="#9a968c">No network call without a key</text>

  <!-- 4 -->
  <rect x="72" y="830" width="628" height="150" rx="18" fill="#fff" stroke="#d6d1c8" stroke-width="2.5"/>
  <text x="108" y="884" font-size="34" font-weight="800" fill="#1c1b18">Is the score high enough?</text>
  <text x="108" y="926" font-size="26" fill="#6b6860">The fuller the context, the lower the bar</text>
  <rect x="780" y="870" width="270" height="70" rx="35" fill="none" stroke="#d6d1c8" stroke-width="2.5"/>
  <text x="915" y="915" font-size="28" fill="#6b6860" text-anchor="middle">Stay quiet</text>
  <text x="790" y="982" font-size="23" fill="#6b6860">150K: score ≥ 0.85</text>
  <text x="790" y="1014" font-size="23" fill="#6b6860">200K+: score ≥ 0.45</text>

  <!-- 5 -->
  <rect x="72" y="1040" width="628" height="100" rx="18" fill="#c4562f"/>
  <text x="108" y="1103" font-size="36" font-weight="800" fill="#fff">Nudge: pass the baton</text>
</svg>
